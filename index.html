'use strict';
const KEY='xceed_slideshow_v5';const names=['Team Leader','Banker','Medical Lead','Legal Lead','Advocacy Lead','Handover Lead'];const cats=['Medical','Legal','Advocacy'];const labels={Medical:['Identify urgent medical needs','Secure medical assessment and treatment','Establish ongoing medical monitoring'],Legal:['Confirm whereabouts of six students','Secure independent legal representation','Initiate a formal legal challenge'],Advocacy:['Establish safe family communication','Raise verified public awareness','Secure funding and external support']};const resources={Medical:['Volunteer Medical Network','Local Emergency Medical Team','International Medical Response Team'],Legal:['Student Legal Clinic','Local Human Rights Lawyer','International Legal Team'],Advocacy:['Student Advocacy Network','Human Rights Campaign Team','International Advocacy Coalition']};const tierName=['Budget · Very hard','Mid-range · Hard','Premium · Medium'];const prices=[1500,3000,5000];const discount=[1,.8,.6,.4];const refund=[1,.7,.4,.1];const slides=['Welcome','The situation','Your mission','Rules & resources','Assign roles','Resource market','Crisis 1','Objectives 1–3','Crisis 2','Objectives 4–6','Crisis 3','Objectives 7–9','Handover'];
const qs={"Medical":[[{"q":"Which enzyme is primarily responsible for removing RNA primers during DNA replication in prokaryotes?","o":["DNA polymerase I","DNA polymerase III","Primase","DNA ligase"],"a":0},{"q":"Which cellular structure is the principal site of beta-oxidation of long-chain fatty acids?","o":["Cytosol","Mitochondrial matrix","Golgi apparatus","Nucleolus"],"a":1},{"q":"Which electrolyte abnormality most classically causes tall, peaked T waves on ECG?","o":["Hypokalaemia","Hyperkalaemia","Hypercalcaemia","Hyponatraemia"],"a":1}],[{"q":"In the oxygen–haemoglobin dissociation curve, which change shifts the curve to the left?","o":["Increased temperature","Increased 2,3-BPG","Decreased carbon dioxide","Decreased pH"],"a":2},{"q":"Which immunoglobulin class crosses the placenta most efficiently?","o":["IgA","IgM","IgE","IgG"],"a":3},{"q":"Which nephron segment is the main site of glucose reabsorption under normal conditions?","o":["Proximal convoluted tubule","Thick ascending limb","Distal convoluted tubule","Collecting duct"],"a":0}],[{"q":"Which complement component acts as the major opsonin in the alternative pathway?","o":["C1q","C3b","C5a","C9"],"a":1},{"q":"What is the principal immediate compensatory response to acute metabolic acidosis?","o":["Increased bicarbonate reabsorption over days","Reduced ventilation","Increased alveolar ventilation","Increased aldosterone secretion"],"a":2},{"q":"Which cranial nerve carries parasympathetic fibres to the parotid gland?","o":["Facial (VII)","Glossopharyngeal (IX)","Vagus (X)","Hypoglossal (XII)"],"a":1}]],"Legal":[[{"q":"Which companion led the Muslim delegation in negotiations with the Negus of Abyssinia?","o":["Jaʿfar ibn Abi Talib","Musʿab ibn ʿUmayr","Zayd ibn Harithah","Abu Ubaydah ibn al-Jarrah"],"a":0},{"q":"Which companion was sent to Madinah before the Hijrah to teach the Qur’an?","o":["Muʿadh ibn Jabal","Musʿab ibn ʿUmayr","Saʿd ibn Muʿadh","Zayd ibn Thabit"],"a":1},{"q":"The Treaty of Hudaybiyyah was concluded in which Hijri year?","o":["4 AH","5 AH","6 AH","8 AH"],"a":2}],[{"q":"Which battle is also known as the Battle of the Trench?","o":["Uhud","Khandaq","Hunayn","Muʾtah"],"a":1},{"q":"Which companion was appointed to lead the first official collection of Qur’anic material under Abu Bakr?","o":["Ibn Abbas","Zayd ibn Thabit","Abu Hurayrah","Khalid ibn al-Walid"],"a":1},{"q":"Who was the first muezzin of Islam?","o":["Bilal ibn Rabah","Salman al-Farisi","Abu Dharr al-Ghifari","Ammar ibn Yasir"],"a":0}],[{"q":"Which Umayyad caliph is associated with commissioning the Dome of the Rock in Jerusalem?","o":["Umar ibn Abd al-Aziz","Abd al-Malik ibn Marwan","Muawiyah ibn Abi Sufyan","Al-Walid II"],"a":1},{"q":"Which caliph is traditionally associated with standardising the written mushaf copies?","o":["Umar ibn al-Khattab","Ali ibn Abi Talib","Uthman ibn Affan","Abu Bakr al-Siddiq"],"a":2},{"q":"In which battle did Muslims first face the Quraysh in a major armed confrontation?","o":["Badr","Uhud","Khandaq","Hunayn"],"a":0}]],"Advocacy":[[{"q":"In the science of hadith, what is the term for a report transmitted by a large number of independent narrators at every level?","o":["Mursal","Mutawatir","Muallaq","Mawdu"],"a":1},{"q":"Which term denotes a communal obligation discharged when enough people fulfil it?","o":["Fard kifayah","Fard ayn","Mandub","Makruh"],"a":0},{"q":"Which surah contains Ayat al-Kursi?","o":["Al-Nisa","Al-Baqarah","Al-Imran","Al-Maidah"],"a":1}],[{"q":"What is the term for juristic consensus among qualified scholars?","o":["Qiyas","Ijma","Istihsan","Tafsir"],"a":1},{"q":"What is the Arabic term for the mandatory alms on qualifying wealth?","o":["Waqf","Zakat","Hibah","Kaffarah"],"a":1},{"q":"Which of these is a pillar of iman rather than a pillar of Islam?","o":["Hajj","Salah","Belief in the angels","Zakat"],"a":2}],[{"q":"Which of the following best describes ihsan in the well-known Hadith of Jibril?","o":["To fast voluntarily each week","To function fresh(){return {page:0,team:'',roles:{},cash:10000,held:{Medical:-1,Legal:-1,Advocacy:-1},paid:{Medical:0,Legal:0,Advocacy:0},decisions:{},answers:{},selected:{},locked:{},handover:'',prepStarted:0,prepElapsed:0,removed:{},sacrificed:{}}};let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}let history=[];let toastTimer;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function snap(){history.push(JSON.stringify(s));if(history.length>80)history.shift()}function change(fn){snap();fn();save();render()}function undo(){if(!history.length){notice('Nothing to undo yet');return}s=JSON.parse(history.pop());save();render()}function notice(t){let old=document.querySelector('.toast');if(old)old.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2800)}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '£'+Math.round(n).toLocaleString('en-GB')}function achieved(){return Object.entries(s.answers).filter(([k,v])=>v===true&&!s.sacrificed?.[k]).length}function ck(){return s.page>=10?3:s.page>=8?2:s.page>=6?1:0}function stagePrice(t){return Math.round(prices[t]*discount[ck()]/50)*50}function owned(cat){return s.held[cat]}function canBuy(cat,t){let old=owned(cat);let refundAmount=old<0?0:Math.round(s.paid[cat]*refund[ck()]/50)*50;return s.cash+refundAmount>=stagePrice(t)}function resourceBuy(cat,t){if(s.locked[cat+'-'+Math.floor((s.page-7)/2)]&&s.page%2===1){notice('Answer already submitted');return}if(owned(cat)===t){notice('Already selected');return}if(!canBuy(cat,t)){notice('Insufficient funds — choose another tier');return}change(()=>{let old=owned(cat);if(old>=0)s.cash+=Math.round(s.paid[cat]*refund[ck()]/50)*50;s.cash-=stagePrice(t);s.held[cat]=t;s.paid[cat]=stagePrice(t);delete s.selected[cat+'-'+Math.floor((s.page-7)/2)];delete s.removed[cat+'-'+Math.floor((s.page-7)/2)]});closeMarket();notice('Resource updated')}
function sellResource(cat){if(owned(cat)<0)return;let val=Math.round(s.paid[cat]*refund[ck()]/50)*50;if(!confirm('Sell '+resources[cat][owned(cat)]+' for '+money(val)+'? You will have no '+cat.toLowerCase()+' resource until you buy another.'))return;change(()=>{s.cash+=val;s.held[cat]=-1;s.paid[cat]=0});closeMarket()}
function crisisInfo(n){return [null,{name:'A life on the line',body:'Mariam Hassan, 21, has type 1 diabetes and may have missed insulin for more than 24 hours. An anonymous doctor offers to circulate identifiable medical records without consent. Alternatively, you can pay £1,000 for a confidential assessment. A relief fund will donate £2,000 if her needs are addressed safely.',opts:[['Circulate the leaked records','Rapid publicity, but confidentiality is compromised.'],['Arrange a confidential assessment','Pay £1,000, with possible relief funding.']]},{name:'The evidence that could change everything',body:'Anonymous photographs allegedly show the six missing students. Publishing them could raise £3,000 immediately, but the images have not been verified. Authorities threaten to move detainees within six hours.',opts:[['Publish the photographs now','Receive the pledged £3,000, subject to verification.'],['Verify before publishing','Delay publication to protect accuracy and trust.']]},{name:'The final countdown',body:'The six students face a secret military tribunal in 12 hours. A major donor has withdrawn £2,000. You can fund an international emergency campaign for £3,000 or preserve the remaining funds.',opts:[['Launch the emergency campaign','Costs £3,000; potential international response.'],['Preserve the funds','Avoid the campaign cost.']]}][n]}
function resolve(n,opt){if(s.decisions[n])return;
 let cost= n===1?1000:n===2?(opt===0?1500:1000):(opt===0?3000:1000);
 let grant=0,penalty=0,result='';
 if(n===1){if(opt===0){penalty=1000;result='The records spread beyond the intended medical team. A further £1,000 safeguarding response is required; access remains unresolved.'}else{grant=2000;if(owned('Medical')===2)cost=0;result='Confidential assessment arranged. The relief fund contributes £2,000.'+(owned('Medical')===2?' Your premium medical team covers the £1,000 assessment fee.':'')}}
 if(n===2){if(opt===0){penalty=2000;result='The photographs prove false. The conditional £3,000 pledge is repaid, and £2,000 is lost to correction and legal costs.'}else{grant=500;result='Verification exposes the images as false; supporters contribute £500.'}}
 if(n===3){penalty=2000;if(opt===0){grant=5000;result='A £2,000 donor withdrawal hits the team. The emergency campaign postpones proceedings and brings £5,000 in new support.'}else{grant=500;result='A £2,000 donor withdrawal hits the team. A limited response is funded and supporters contribute £500.'}}
 if(s.cash<cost){notice('Insufficient funds. Refund a completed objective or change resources to finance this response.');return}
 let delta=grant-cost-penalty;
 change(()=>{s.cash+=delta;s.decisions[n]={opt,delta,cost,grant,penalty,result}});
}
function refundObjective(key){if(s.answers[key]!==true||s.sacrificed?.[key])return;
 const [cat,ix]=key.split('-');const title=labels[cat]?.[Number(ix)]||key;
 if(!confirm('PERMANENTLY sacrifice objective '+cat[0]+(Number(ix)+1)+' — '+title+' — for £1,000? This objective will no longer count toward Amnesty’s 6/9 target and cannot be earned again.'))return;
 change(()=>{s.sacrificed[key]=true;s.cash+=1000});notice('Objective sacrificed: +£1,000');
}
function sacrificePanel(){const available=Object.keys(s.answers).filter(k=>s.answers[k]===true&&!s.sacrificed?.[k]);return `<div class="card red"><span class="tag red">Emergency funding</span><h3>Refund a completed objective — +£1,000</h3><p>Sacrifice an achieved objective permanently to recover funds. It will no longer count towards Amnesty’s 6/9 requirement.</p>${available.length?available.map(k=>{let [c,i]=k.split('-');return `<button class="btn ghost small" style="margin:4px" onclick="refundObjective('${k}')">Sacrifice ${c[0]}${Number(i)+1}: ${esc(labels[c][Number(i)])} · +£1,000</button>`}).join(''):'<p class="muted">No completed objectives available to refund.</p>'}</div>`}
function eliminate(cat,i){const key=cat+'-'+i,t=owned(cat);if(t<0||s.answers[key]!==undefined)return;const count=(s.removed?.[key]||[]).length;if(count>=2){notice('Maximum two answers eliminated');return}if(s.cash<500){notice('Insufficient funds for £500 assistance');return}let q=qs[cat][i][t],wrong=q.o.map((_,j)=>j).filter(j=>j!==q.a&&!(s.removed[key]||[]).includes(j));let target=wrong[wrong.length-1];change(()=>{s.cash-=500;s.removed[key]=[...(s.removed[key]||[]),target];if(s.selected[key]===target)delete s.selected[key]});}
function next(){let p=s.page;if(p===4){if(!s.team.trim()){notice('Enter a team name first');return}if(names.some(n=>!String(s.roles[n]||'').trim())){notice('Allocate all six roles first');return}}if([6,8,10].includes(p)&&!s.decisions[(p-4)/2]){notice('Choose a crisis response before continuing');return}if([7,9,11].includes(p)){let i=(p-7)/2;if(cats.some(c=>s.answers[c+'-'+i]===undefined)){notice('Submit all three mission answers before continuing');return}}if(p>=12)return;change(()=>{if(p===4&&!s.prepStarted)s.prepStarted=Date.now();s.page++});window.scrollTo(0,0)}function back(){if(s.page===0)return;change(()=>{s.page--});window.scrollTo(0,0)}function restart(){if(!confirm('Restart the entire simulation? All progress on this device will be cleared.'))return;snap();s=fresh();save();render();window.scrollTo(0,0)}function go(n){change(()=>{s.page=n});window.scrollTo(0,0)}
function resourceCards(cat,compact=false){return `<div class="grid">${[0,1,2].map(t=>`<div class="card resource ${owned(cat)===t?'active':''}"><span class="tag ${t===2?'red':''}">${tierName[t]}</span><h3>${resources[cat][t]}</h3><div class="price">${money(stagePrice(t))}</div><div class="level">${t===0?'Very hard specialist knowledge':t===1?'Hard specialist knowledge':'Medium specialist knowledge'}</div><button class="btn ${owned(cat)===t?'ghost':''}" onclick="resourceBuy('${cat}',${t})" ${owned(cat)===t?'disabled':''}>${owned(cat)===t?'✓ Selected':canBuy(cat,t)?(owned(cat)>=0?'Switch resource':'Hire resource'):'Not affordable'}</button></div>`).join('')}</div>`}
function objectiveList(){return cats.map(c=>`<div class="card"><span class="tag">${c}</span>${labels[c].map((l,i)=>{let done=s.answers[c+'-'+i]===true&&!s.sacrificed?.[c+'-'+i];return `<div class="obj"><span class="tick ${done?'yes':''}">${done?'✓':i+1}</span><div><b>${c[0]}${i+1}</b> · ${l}</div></div>`}).join('')}</div>`).join('')}
function quizCard(cat,i){let key=cat+'-'+i,t=owned(cat),answered=s.answers[key]!==undefined,sel=s.selected[key],q=t<0?null:qs[cat][i][t],removed=s.removed?.[key]||[],sacrificed=!!s.sacrificed?.[key];return `<div class="question"><div class="sectionlabel"><div><span class="tag">${cat} · ${cat[0]}${i+1}</span><h3>${labels[cat][i]}</h3></div><span class="tag ${answered&&s.answers[key]&&!sacrificed?'':'red'}">${answered?(sacrificed?'Sacrificed':s.answers[key]?'✓ Achieved':'✕ Not achieved'):(t<0?'No resource':tierName[t])}</span></div><div class="specialist">ONLY THE ${cat.toUpperCase()} LEAD MAY ANSWER THIS QUESTION. NO HELP FROM TEAMMATES.</div>${answered?`<div class="outcome ${s.answers[key]&&!sacrificed?'':'bad'}">${sacrificed?'Objective refunded for £1,000 — permanently forfeited.':s.answers[key]?`✓ OBJECTIVE ACHIEVED: ${cat[0]}${i+1} — ${esc(labels[cat][i])}`:'Incorrect — objective not achieved.'} ${q?`Correct answer: <b>${esc(q.o[q.a])}</b>.`:''}</div>`:t<0?`<p>Hire a ${cat.toLowerCase()} resource to unlock the question.</p><button class="btn small" onclick="openMarket('${cat}')">Open resource market</button>`:`<p class="lead" style="font-size:17px">${esc(q.q)}</p>${q.o.map((o,j)=>removed.includes(j)?`<div class="choice eliminated"><strong>${String.fromCharCode(65+j)}. Eliminated</strong></div>`:`<button class="choice ${sel===j?'selected':''}" onclick="selectAnswer('${cat}',${i},${j})"><strong>${String.fromCharCode(65+j)}. ${esc(o)}</strong></button>`).join('')}<div class="buttons" style="margin-top:14px"><button class="btn" onclick="submitAnswer('${cat}',${i})" ${sel===undefined?'disabled':''}>Submit final answer</button><button class="btn ghost" onclick="openMarket('${cat}')">Upgrade / switch resource</button><button class="btn ghost" onclick="eliminate('${cat}',${i})" ${removed.length>=2||s.cash<500?'disabled':''}>Eliminate wrong answer · £500 (${removed.length}/2)</button></div><p class="muted" style="font-size:12px">You may upgrade after seeing the question or pay up to £1,000 to eliminate two incorrect options. Only the assigned specialist can answer.</p>`}</div>`}
function selectAnswer(c,i,j){change(()=>{s.selected[c+'-'+i]=j})}function submitAnswer(c,i){let key=c+'-'+i,t=owned(c);if(t<0||s.selected[key]===undefined){notice('Choose an answer first');return}change(()=>{s.answers[key]=s.selected[key]===qs[c][i][t].a;s.locked[key]=true})}
function openMarket(cat){let e=document.getElementById('marketModal');e.innerHTML=`<div class="modalbox"><div class="sectionlabel"><h2>Change ${cat.toLowerCase()} resource</h2><button class="btn ghost small" onclick="closeMarket()">Close ✕</button></div><p class="muted">Switch now, even after seeing a question. You must switch before submitting. Refunds are based on the current checkpoint.</p><p><b>Funds available: ${money(s.cash)}</b> · Refund on current resource: ${owned(cat)<0?'None':money(Math.round(s.paid[cat]*refund[ck()]/50)*50)}</p>${resourceCards(cat,true)}${owned(cat)>=0?`<div class="note warn"><button class="btn danger small" onclick="sellResource('${cat}')">Sell current resource for ${money(Math.round(s.paid[cat]*refund[ck()]/50)*50)}</button></div>`:''}</div>`;e.style.display='grid'}function closeMarket(){document.getElementById('marketModal').style.display='none'}
function render(){let p=s.page,html='';if(p===0){html=`<section class="hero"><div class="eyebrow">Student BIMA · XCeed interactive challenge</div><h1>72 Hours<br>to <em>Act.</em></h1><p>Forty students arrested. Six missing. Three crises. Nine objectives. One team. Can you build a response that Amnesty International will take seriously?</p><button class="btn" onclick="next()">Begin game →</button></section>`}if(p===1){html=`<div class="eyebrow">01 / The situation</div><h1>Six students.<br>Unaccounted for.</h1><p class="lead">In the fictional country of <b>Navara</b>, forty university students have been arrested after peaceful protests. Six have disappeared from official records. Families are frightened. The authorities refuse to disclose their whereabouts.</p><div class="grid"><div class="card red"><div class="large">40</div><h3>Students arrested</h3><p>Following a peaceful demonstration.</p></div><div class="card red"><div class="large">6</div><h3>Students missing</h3><p>Their locations remain unconfirmed.</p></div><div class="card accent"><div class="large">72 hours</div><h3>Time to act</h3><p>Your team must prepare a credible response.</p></div></div><div class="note">You lead a fictional humanitarian response organisation. You will confront urgent medical, legal and advocacy challenges while balancing ethical choices and limited resources.</div>`}if(p===2){html=`<div class="eyebrow">02 / The mission</div><h1>Earn Amnesty's confidence.</h1><p class="lead">At the end of the simulation, you must <b>hand over your case to Amnesty International</b>. To demonstrate enough potential for Amnesty to consider taking it on, your team must achieve <b>at least 6 of 9 objectives</b>.</p><div class="grid">${objectiveList()}</div><div class="note warn"><b>Your target: 6 / 9.</b> Each objective is earned by correctly answering a general-knowledge question after a crisis. Buying a resource alone never earns an objective.</div>`}if(p===3){html=`<div class="eyebrow">03 / How to play</div><h1>Think. Delegate. Decide.</h1><div class="grid two"><div class="card"><span class="tag">Budget</span><h3>£10,000 starting funds</h3><p>Hire one resource in each of the Medical, Legal and Advocacy categories. Every crisis response costs money. The Banker manages the budget, resources and £500 question assistance. You can sacrifice an achieved objective for £1,000 if you need funds.</p></div><div class="card"><span class="tag">Questions</span><h3>Three questions after each crisis</h3><p><b>Medical:</b> science. <b>Legal:</b> Islamic history. <b>Advocacy:</b> Islamic deen. Correct answers earn checklist objectives.</p></div><div class="card"><span class="tag">Difficulty</span><h3>Pay for an advantage</h3><p>Budget resources give very hard questions, mid-range resources give hard questions, and premium resources give medium questions. Pay £500 to eliminate one incorrect MCQ option, up to two per question.</p></div><div class="card"><span class="tag">Flexibility</span><h3>Upgrade after seeing a question</h3><p>If it is too difficult, refund your resource and buy another — if you can afford it. You can also permanently refund an achieved objective for £1,000. You cannot earn a sacrificed objective again.</p></div></div><div class="note warn"><b>Only the Team Leader may touch the computer.</b> During crisis decisions, teammates may advise. During specialist questions, ONLY the relevant lead may answer, with no help from teammates. The Handover Lead should take notes on paper. There is no on-screen action log or handover template.</div><p class="muted">The first crisis occurs at approximately minute 7. The facilitator controls the pace of subsequent crises. Use Back or Undo to correct accidental clicks.</p>`}if(p===4){html=`<div class="eyebrow">04 / Team formation</div><h1>Assign your response team.</h1><p class="lead">Allocate all six roles before entering the resource market. Each person contributes, but <b>only the Team Leader operates this device</b>.</p><div class="card" style="max-width:760px"><label><b>Team name</b><input class="field" style="margin:8px 0 20px" placeholder="e.g. Team Al-Shifa" value="${esc(s.team)}" oninput="setField('team',this.value)"></label>${names.map((n,i)=>`<label class="role"><b>${esc(n)}</b><input placeholder="Name of team member" value="${esc(s.roles[n]||'')}" oninput="setRole('${n}',this.value)"></label>`).join('')}</div><div class="note"><b>Roles:</b> Leader coordinates and clicks; Banker advises on spending; Medical, Legal and Advocacy Leads guide their question categories; Handover Lead records the team's reasoning and prepares the final handover.</div>`}if(p===5){html=`<div class="eyebrow">05 / Resource market · preparation</div><h1>Build your response.</h1><p class="lead">You have until approximately <b>minute 7</b> to prepare for Crisis 1. Decide where to invest. You may hold one resource per category, and you can switch later.</p><div class="statrow"><span class="stat">Funds remaining: <b>${money(s.cash)}</b></span><span class="stat">Amnesty target: <b>6 / 9</b></span></div>${cats.map(c=>`<div class="sectionlabel"><h2>${c}</h2><span class="tag">${owned(c)<0?'Not hired':tierName[owned(c)]}</span></div>${resourceCards(c)}${owned(c)>=0?`<button class="btn ghost small" onclick="sellResource('${c}')">Sell ${c.toLowerCase()} resource</button>`:''}`).join('')}${sacrificePanel()}<div class="note">Prices decrease after each crisis. Refunds for existing resources are 70% at Crisis 1, 40% at Crisis 2 and 10% at Crisis 3, based on what you originally paid. You can continue even if you choose not to hire all three resources, but unanswered objectives cannot be earned.</div>`}if([6,8,10].includes(p)){let n=(p-4)/2,cr=crisisInfo(n),d=s.decisions[n];html=`<div class="eyebrow">Crisis ${n} / 3 · ${n===1?'Minute 7':n===2?'Checkpoint 2':'Checkpoint 3'}</div><h1>${cr.name}.</h1><p class="lead">${cr.body}</p><div class="statrow"><span class="stat">Team: <b>${esc(s.team)}</b></span><span class="stat">Funds available: <b>${money(s.cash)}</b></span><span class="stat">Objectives: <b>${achieved()} / 9</b></span></div><div class="buttons" style="margin:15px 0">${cats.map(c=>`<button class="btn ghost small" onclick="openMarket('${c}')">Manage ${c} resource</button>`).join('')}</div>${n===1?`<div class="note"><b>Medical resource perk:</b> ${owned('Medical')===2?'Premium medical response covers the £1,000 confidential assessment fee.':'Premium medical resources can cover the confidential assessment fee.'}</div>`:n===2?`<div class="note"><b>Legal intelligence:</b> ${owned('Legal')===0?'Student Legal Clinic estimates a 15% probability that the photographs are fake.':owned('Legal')===1?'Local Human Rights Lawyer estimates a 40% probability that the photographs are fake.':owned('Legal')===2?'International Legal Team estimates a 60% probability that the photographs are fake.':'No legal intelligence available. Hire a legal resource for an estimate.'}</div>`:''}${d?`<div class="card accent"><span class="tag">Decision recorded</span><h2>${cr.opts[d.opt][0]}</h2><p>${d.result}</p><div class="large">${d.delta>=0?'+':''}${money(d.delta)}</div><p class="muted">You can use Undo to reverse an accidental choice.</p></div>`:`<div class="grid two">${cr.opts.map((o,j)=>`<div class="card red"><span class="tag red">Option ${j?'B':'A'}</span><h3>${o[0]}</h3><p>${o[1]}</p><p><b>Response cost: ${money(n===1?(j===1&&owned('Medical')===2?0:1000):n===2?(j===0?1500:1000):(j===0?3000:1000))}</b> before donations, penalties or other consequences.</p><button class="btn ${j?'ghost':'danger'}" onclick="resolve(${n},${j})">Choose option ${j?'B':'A'} →</button></div>`).join('')}</div>`}${sacrificePanel()}<div class="note">After resolving this crisis, answer three specialist questions to earn the next three objectives.</div>`}if([7,9,11].includes(p)){let i=(p-7)/2;html=`<div class="eyebrow">Checkpoint ${i+1} / 3 · Objective challenges</div><h1>Prove your team's knowledge.</h1><p class="lead">Three categories. Three questions. Each correct answer earns one mission objective. The specialist leads advise the Team Leader, who submits the answers.</p><div class="statrow"><span class="stat">Achieved: <b>${achieved()} / 9</b></span><span class="stat">Amnesty threshold: <b>6 / 9</b></span><span class="stat">Funds available: <b>${money(s.cash)}</b></span></div>${cats.map(c=>quizCard(c,i)).join('')}${sacrificePanel()}<div class="note">Questions change with resource difficulty. Upgrade or downgrade after seeing a question if you wish. Once you submit an answer, it is final unless you use Undo to correct an accidental submission.</div>`}if(p===12){let a=achieved();html=`<div class="eyebrow">Final stage / Handover</div><h1>Hand over to<br>Amnesty International.</h1><p class="lead">Your organisation's initial response is complete. Present what you discovered, what you achieved, your decisions and what remains unresolved. <b>There is no prescribed handover format.</b></p><div class="grid two"><div class="card ${a>=6?'accent':'red'}"><span class="tag ${a>=6?'':'red'}">Your result</span><div style="font-size:70px;line-height:1;font-weight:950;color:${a>=6?'var(--teal)':'var(--red)'}">${a}<span style="font-size:30px;color:var(--muted)"> / 9</span></div><h3 style="margin-top:16px">${a>=6?'Threshold reached':'Below the threshold'}</h3><p>${a>=6?'You have achieved at least six objectives. Amnesty can see sufficient potential to consider taking the case forward.':'You have not reached six objectives. Explain your progress and what additional work would strengthen the case.'}</p></div><div class="card"><span class="tag">Handover guidance</span><h3>Tell the story of your response</h3><p>What happened? Which objectives were achieved? What decisions did you make and why? What should the incoming team prioritise next?</p><p><b>Handover Lead:</b> use your handwritten notes to brief Amnesty.</p></div></div><div class="sectionlabel"><h2>Mission checklist</h2><span class="tag">${a} / 9 achieved</span></div><div class="grid">${objectiveList()}</div><div class="note">After the handover, the facilitator will lead a reflection on leadership, resource allocation, communication, uncertainty and how healthcare skills apply beyond clinical settings.</div>`}
 document.getElementById('root').innerHTML=html;document.getElementById('progress').style.width=((p+1)/slides.length*100)+'%';document.getElementById('stepcount').textContent=`${p+1} / ${slides.length} · ${slides[p]}`;document.getElementById('back').disabled=p===0;document.getElementById('next').style.display=p===0||p===12?'none':'';document.getElementById('next').textContent=p===11?'Go to handover →':p===5?'Begin Crisis 1 →':'Continue →';document.getElementById('undo').disabled=history.length===0;document.getElementById('undoTop').disabled=history.length===0;
}function setField(k,v){s[k]=v;save()}function setRole(k,v){s.roles[k]=v;save()};let modal=document.createElement('div');modal.id='marketModal';modal.style.cssText='display:none;position:fixed;inset:0;z-index:10;background:#061f24b8;place-items:center;padding:20px;overflow:auto';modal.innerHTML='';document.body.append(modal);let style=document.createElement('style');style.textContent='.modalbox{width:min(980px,100%);max-height:92vh;overflow:auto;background:var(--paper);padding:24px;border-radius:18px;box-shadow:0 30px 70px #0005}';document.head.append(style);modal.addEventListener('click',e=>{if(e.target===modal)closeMarket()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMarket();if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back()}});render();
</script></body></html>
